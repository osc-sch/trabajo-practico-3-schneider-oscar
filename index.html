<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://i.pinimg.com/originals/b0/9d/89/b09d8964573bee9b39a281a908a323fe.png"
        type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="asset/css/style.css">
    <title>Simpson TV</title>
</head>

<body>

    <header class="d-flex bg-warning p-4 align-content-center justify-content-center">
        <h1 class="fw-bold">Todos Los personajes de Los Simpson</h1>
    </header>
    <nav class="p-3 bg-dark d-flex justify-content-center align-items-center">
        <div class="input-group" style="width: 400px;">
            <input type="text" class="form-control" placeholder="Buscar Personaje..."
                aria-label="Recipients username with two button addons" id="buscador">
            <button class="btn btn-outline-warning" type="button" id="btn-limpiar"><i class="bi bi-x"></i></button>
        </div>
    </nav>
    <main>

        <!-- seccion de cartas -->
        <section>
            <!-- contenedor de todas las cartas -->
            <div class="d-flex m-5 justify-content-around">
                <div class="row g-4" id="contenedor_cards">

                </div>
            </div>
        </section>
        <!-- seccion de modal -->
        <section>
            <!-- Modal -->
            <div class="modal modal-lg fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header justify-content-between">
                            <h1 class="modal-title fs-5" id="myModalLabel">Modal title</h1>
                            <button type="button" class="btn btn-outline-warning" data-bs-dismiss="modal"
                                aria-label="Close"><i class="bi bi-x"></i></button>
                        </div>
                        <div class="modal-body d-flex row">
                            <img src="https://cdn.thesimpsonsapi.com/500/character/5.webp" alt="" width="40%"
                                id="image_detalle" class="col-6">
                            <div class="col-6">
                                <p></i>Nombre Completo: <span id="nombre"></span></p>
                                <hr>
                                <p>Edad: <span id="age"></span></p>
                                <hr>
                                <p>Fecha de Nacimiento: <span id="cumple"></span></p>
                                <hr>
                                <p>Genero: <span id="sex"></span></p>
                                <hr>
                                <p>Ocupacion: <span id="ocu"></span></p>
                                <hr>
                                <p>Estado: <span id="state" class="fs-6"></span></p>
                                <hr>
                                <p>Frase: <span id="phas"></span></p>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-warning" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Modal de Error -->
        <section>
            <div class="modal fade" id="modalError" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Error al cargar...</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            Error de conexion...
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class=" d-flex p-5 align-items-center justify-content-center bg-dark">
        <p class="text-warning"><em>&copy;Schneider Oscar</em> Todos los derechos reservados</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="asset/js/app.js"></script>
</body>

</html>
